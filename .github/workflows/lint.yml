name: Code Quality

on:
  push:
    branches: [ main, master, claude/** ]
  pull_request:
    branches: [ main, master ]

jobs:
  lint:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v3

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'

    - name: Install linting tools
      run: |
        python -m pip install --upgrade pip
        pip install flake8 black isort pylint

    - name: Run flake8
      run: |
        flake8 . --count --show-source --statistics --exclude=venv,env,.venv,.git,__pycache__

    - name: Check code formatting with black
      run: |
        black --check --diff . --exclude '(venv|env|\.venv|\.git|__pycache__|build|dist)'

    - name: Check import sorting with isort
      run: |
        isort --check-only --diff . --skip venv --skip env --skip .venv

    - name: Run pylint
      run: |
        pylint **/*.py --exit-zero --disable=C,R --ignore=venv,env,.venv
