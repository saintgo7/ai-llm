# Logstash Configuration for ELK Stack
input {
  # File input for application logs
  file {
    path => "/var/log/app/*.log"
    start_position => "beginning"
    sincedb_path => "/dev/null"
    codec => "json"
    tags => ["application"]
  }

  # Docker logs
  docker {
    host => "unix:///var/run/docker.sock"
    tags => ["docker"]
  }

  # Beats input (for Filebeat)
  beats {
    port => 5044
    tags => ["beats"]
  }

  # HTTP input (for direct log shipping)
  http {
    port => 8080
    codec => "json"
    tags => ["http"]
  }
}

filter {
  # Parse JSON logs
  if [tags] == "application" {
    json {
      source => "message"
    }

    # Extract log level
    grok {
      match => { "message" => "%{TIMESTAMP_ISO8601:timestamp} - %{WORD:logger} - %{LOGLEVEL:level} - %{GREEDYDATA:log_message}" }
    }

    # Add fields
    mutate {
      add_field => { "environment" => "production" }
      add_field => { "application" => "ai-llm" }
    }
  }

  # Parse Docker logs
  if [tags] == "docker" {
    json {
      source => "message"
    }

    # Extract container info
    mutate {
      rename => { "[docker][container][name]" => "container_name" }
      rename => { "[docker][container][id]" => "container_id" }
    }
  }

  # Add geoip data for IP addresses
  if [client_ip] {
    geoip {
      source => "client_ip"
      target => "geoip"
    }
  }

  # Parse timestamps
  date {
    match => [ "timestamp", "ISO8601" ]
    target => "@timestamp"
  }

  # Remove unnecessary fields
  mutate {
    remove_field => [ "host", "agent", "ecs" ]
  }
}

output {
  # Output to Elasticsearch
  elasticsearch {
    hosts => ["elasticsearch:9200"]
    index => "app-logs-%{+YYYY.MM.dd}"
    user => "elastic"
    password => "${ELASTIC_PASSWORD}"
  }

  # Output to stdout for debugging
  if [level] == "ERROR" or [level] == "CRITICAL" {
    stdout {
      codec => rubydebug
    }
  }

  # Send alerts to Slack for critical errors
  if [level] == "CRITICAL" {
    http {
      url => "${SLACK_WEBHOOK_URL}"
      http_method => "post"
      format => "json"
      mapping => {
        "text" => "🚨 CRITICAL ERROR: %{log_message}"
        "channel" => "#alerts"
      }
    }
  }
}
