apiVersion: v1
kind: ConfigMap
metadata:
  name: ai-llm-config
data:
  database-url: "postgresql://appuser:password@postgres:5432/appdb"
  redis-url: "redis://redis:6379"
  log-level: "INFO"
  flask-env: "production"
  api-host: "0.0.0.0"
  api-port: "5000"
  enable-rate-limiting: "true"
  max-requests-per-minute: "100"
