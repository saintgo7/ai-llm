apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: ai-llm-ingress
  annotations:
    kubernetes.io/ingress.class: "nginx"
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
    nginx.ingress.kubernetes.io/rate-limit: "100"
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/force-ssl-redirect: "true"
spec:
  tls:
  - hosts:
    - api.ai-llm.com
    secretName: ai-llm-tls
  rules:
  - host: api.ai-llm.com
    http:
      paths:
      - path: /api/v1
        pathType: Prefix
        backend:
          service:
            name: api-server
            port:
              number: 80
      - path: /api/v2
        pathType: Prefix
        backend:
          service:
            name: api-server
            port:
              number: 80
      - path: /auth
        pathType: Prefix
        backend:
          service:
            name: auth-server
            port:
              number: 80
      - path: /api/docs
        pathType: Prefix
        backend:
          service:
            name: api-server
            port:
              number: 80
