apiVersion: v1
kind: Service
metadata:
  name: api-server
  labels:
    app: ai-llm
    component: api
spec:
  type: ClusterIP
  selector:
    app: ai-llm
    component: api
  ports:
  - name: http
    port: 80
    targetPort: 5000
    protocol: TCP
  sessionAffinity: None
---
apiVersion: v1
kind: Service
metadata:
  name: auth-server
  labels:
    app: ai-llm
    component: auth
spec:
  type: ClusterIP
  selector:
    app: ai-llm
    component: auth
  ports:
  - name: http
    port: 80
    targetPort: 5001
    protocol: TCP
---
apiVersion: v1
kind: Service
metadata:
  name: postgres
  labels:
    app: ai-llm
    component: database
spec:
  type: ClusterIP
  selector:
    app: ai-llm
    component: postgres
  ports:
  - name: postgres
    port: 5432
    targetPort: 5432
---
apiVersion: v1
kind: Service
metadata:
  name: redis
  labels:
    app: ai-llm
    component: cache
spec:
  type: ClusterIP
  selector:
    app: ai-llm
    component: redis
  ports:
  - name: redis
    port: 6379
    targetPort: 6379
