[project]
name = "rag-chatbot"
version = "0.1.0"
description = "Claude 기반 RAG(검색 증강 생성) 챗봇"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "anthropic>=2.1.0",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]

[project.scripts]
rag-chatbot = "rag_chatbot.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/rag_chatbot"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
